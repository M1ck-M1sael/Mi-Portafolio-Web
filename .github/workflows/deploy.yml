name: Deploy Portafolio

on:
  push:
    branches: ["main"]

env: 
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portafolio_mick-backend
  ECS_SERVICE: Cluster-Portafolio_Mick
  ECS_CLUSTER: Cluster-Portafolio_Mick
  S3_BUCKET: mick-misael-portafolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # backend steps section

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition Portafolio_Mick-Backend-Family --query taskDefinition > task-definition.json

      - name: Fill in the new image ID and Env Vars in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: portafolio_mick-container
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            API_URL=https://mickmisael.com

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # frontend steps section

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Export Reflex Frontend
        run: |
          reflex export --frontend-only
        env:
          API_URL: https://mickmisael.com

      - name: Deploy frontend to S3
        run: |
          aws s3 sync .web/public s3://${{ env.S3_BUCKET }} --delete